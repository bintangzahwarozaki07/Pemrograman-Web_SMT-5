<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Anggota Perpustakaan Kota Madiun</title>
    <link rel="stylesheet" href="formulir_perpuskotamadiun.css">
</head>
<body>

<div class="container">

    <h1>Formulir Anggota</h1>
    <h2>Perpustakaan Kota Madiun</h2>

    <form action="#" method="post">

        <label>Nama Lengkap:</label>
        <input type="text" name="nama" placeholder="Masukkan nama lengkap" required>

        <label>NIK:</label>
        <input type="text" name="nik" placeholder="Nomor Induk Kependudukan" required>

        <label>Tanggal Lahir:</label>
        <input type="date" name="tgl_lahir" required>

        <label>Jenis Kelamin:</label>
        <div class="radio-group">
            <label><input type="radio" name="jk" value="Laki-laki" required> Laki-laki</label>
            <label><input type="radio" name="jk" value="Perempuan"> Perempuan</label>
        </div>

        <label>Alamat Lengkap:</label>
        <textarea name="alamat" rows="4" placeholder="Masukkan alamat lengkap..." required></textarea>

        <label>No. Telepon / WA:</label>
        <input type="text" name="telepon" placeholder="0812xxxxxx" required>

        <label>Hobi Membaca:</label>
        <div class="checkbox-group">
            <label><input type="checkbox" name="hobi_fiksi"> Fiksi</label>
            <label><input type="checkbox" name="hobi_nonfiksi"> Non-Fiksi</label>
            <label><input type="checkbox" name="hobi_komik"> Komik</label>
            <label><input type="checkbox" name="hobi_pengetahuan"> Pengetahuan Umum</label>
        </div>

        <label>Pendidikan Terakhir:</label>
        <select name="pendidikan">
            <option>SMA / SMK</option>
            <option>D3</option>
            <option>S1</option>
            <option>S2</option>
            <option>Lainnya</option>
        </select>

        <label>Alasan Mendaftar:</label>
        <textarea name="alasan" rows="4" placeholder="Tuliskan alasan Anda mendaftar..." required></textarea>

        <button type="submit">Daftar Sekarang</button>

    </form>

</div>

</body>
</html>
